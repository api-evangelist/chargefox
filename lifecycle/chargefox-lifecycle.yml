description: >-
  How Chargefox versions, deprecates and reports on its API estate. Versioning
  is explicit and dual: the Fleets API is versioned in the URI path, and the
  OCPI CPO API carries four concurrent protocol versions negotiated through
  OCPI's own /versions endpoint. Operational transparency is genuinely good —
  a public Atlassian Statuspage with an anonymous JSON API breaks status out to
  component level, including a dedicated "Fleet Management API" and "OCPI"
  component. What is absent is any published deprecation or sunset policy, any
  changelog, and any numeric SLA.

versioning:
  scheme: uri-path
  current: v1
  path_segment: /api/fleets/v1/
  spec_version: '1.0'
  header_versioning: false
  docs: https://app.chargefox.com/developers/docs/fleets
  ocpi:
    scheme: protocol-version negotiation
    mechanism: >-
      OCPI's own versions endpoint, GET /ocpi/cpo/versions, returns the
      supported version list; each version has its own base path.
    supported_versions: ['2', 2.1.1, '2.2', 2.2.1]
    evidence: >-
      All four appear in the published rate-limit table; GET
      /ocpi/cpo/versions, /ocpi/cpo/2.1.1/, /ocpi/cpo/2.2/ and
      /ocpi/cpo/2.2.1/ each returned 401 (a real, authenticated route) on
      2026-07-27, while sibling paths returned 404.
    note: >-
      Running 2.1.1, 2.2 and 2.2.1 concurrently alongside a legacy "2" locations
      path is itself the deprecation posture — old protocol versions are kept
      alive for roaming partners rather than retired on a schedule.

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  notes: >-
    No deprecation policy, sunset schedule or RFC 8594 Sunset/Deprecation header
    support is documented anywhere on the developer site, and no operation in
    the OpenAPI carries `deprecated: true`. No Deprecation pointer is wired into
    apis.yml because there is no policy to point at.

changelog:
  published: false
  probed: 'https://app.chargefox.com/developers/docs/changelog (404)'
  note: >-
    The developer documentation site has exactly three pages — Getting Started,
    Fleets and Rate Limits. There is no changelog, release-notes or migration
    page. Company news is published at https://www.chargefox.com/news but is
    marketing, not API change communication.

sla:
