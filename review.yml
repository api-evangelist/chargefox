identity:
  founded: '2017'
  headquarters: Level 8, 473 Bourke Street, Melbourne, VIC 3000, Australia
  homeMarket: Australia
  ownership: >-
    Wholly owned by Australian Motoring Services (AMS), the joint venture of six
    Australian motoring clubs — NRMA, RACV, RACQ, RAA, RAC and RACT — which
    completed the acquisition of the remaining Chargefox shares in July 2022.
  businessModel: >-
    Charging software platform. Chargefox divested from charging hardware in
    2023 and now operates chargers owned by businesses, governments and
    councils, plus a driver app, a fleet product, roaming with partner networks,
    and vehicle-manufacturer charging subscriptions.
  networkScale: >-
    Figures as published on https://www.chargefox.com/company on 2026-07-27:
    2,200+ public charging plugs nationally, 100+ plugs added monthly, 5,000+
