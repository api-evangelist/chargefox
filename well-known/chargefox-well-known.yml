source: live probes of the Chargefox application and marketing hosts, 2026-07-27
description: >-
  Chargefox publishes no /.well-known/ discovery surface. Every RFC 9116 /
  RFC 8414 / OIDC / api-catalog / ai-plugin path was probed anonymously on both
  the application host that serves the Fleets and OCPI APIs
  (app.chargefox.com) and the marketing host (www.chargefox.com). The
  application host returns nginx 404s for the .well-known namespace and a 403
  for paths its WAF rejects; the Webflow-hosted marketing site returns a
  hand-written "Invalid .well-known request" 404 page. No security.txt, no OAuth
  authorization-server or protected-resource metadata, and no OpenID Connect
  discovery document exists — consistent with an API estate secured by opaque
  bearer tokens and OCPI `Token` credentials issued under commercial agreement
  rather than by a discoverable authorization server.
