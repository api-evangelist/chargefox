apis:
- aid: chargefox:chargefox-fleets-api
  name: Chargefox Fleets API
  description: >-
    Chargefox's documented REST API for fleet customers, described by an
    OpenAPI 3.0.1 contract titled "Fleets API" version 1.0 that the company
    renders publicly with Redoc at
    https://app.chargefox.com/developers/docs/fleets. Four read-only GET
    operations, all tagged Fleets and all secured by the same `bearerAuth`
    HTTP bearer scheme: /api/fleets/v1/usage lists every charge session
    completed by a fleet's managed vehicles on the Chargefox network with
    per-charging-period consumption, tariff, GST and AUD amount;
    /api/fleets/v1/sessions returns the session records; /api/fleets/v1/vehicles
    lists the managed vehicles; /api/fleets/v1/invoices returns invoices. Each
    operation takes optional date_from, date_to and page query parameters and
    returns a paginated set of 100 results per page, and each declares 401, 403
    and (except vehicles) 429 responses. The contract is real and the
    documentation is anonymous, but the data is not: every path returned HTTP
    401 to an unauthenticated request on 2026-07-27. There is no signup, no
    sandbox and no self-service key — Chargefox's own getting-started page says
    that if you are a fleet customer interested in the API you must speak to a
    team member or email fleetsupport@chargefox.com.
  humanURL: https://app.chargefox.com/developers/docs/fleets
  baseURL: https://app.chargefox.com/api/fleets/v1
