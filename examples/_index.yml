    status: 200
    media_type: application/json
    description: >-
      Two charge sessions completed by a fleet's managed vehicles on the
      Chargefox network, each with vehicle, customer, location, EVSE, connector
      and per-charging-period tariff/GST/amount breakdown.
  - file: chargefox-fleets-sessions-200.json
