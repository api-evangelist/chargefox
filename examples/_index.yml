description: >-
  Response examples extracted verbatim from the Chargefox Fleets API OpenAPI
  contract. Chargefox ships a full example payload with every 200 response —
  unusually complete for a four-operation spec, and the only way to see the
  shape of the data given every endpoint returns 401 to an anonymous request.
  The example data is fictional (Transformers-themed vehicles and locations)
  and contains no real customer records. Extracted unmodified; nothing here is
  synthesised.
