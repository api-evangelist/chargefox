  - file: chargefox-fleets-vehicles-200.json
    operation: GET /api/fleets/v1/vehicles
    status: 200
    media_type: application/json
    description: >-
      Three managed vehicles including one retired vehicle (effective_to set)
      and one with no RFID cards attached. The only published example that
      exercises the pagination.next link.
  - file: chargefox-fleets-invoices-200.json
    operation: GET /api/fleets/v1/invoices
